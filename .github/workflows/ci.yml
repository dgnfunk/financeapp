name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deployment-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: ./scripts/test-proxmox-scripts.sh

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: financeapp_test
          POSTGRES_USER: financeapp_test
          POSTGRES_PASSWORD: financeapp_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financeapp_test -d financeapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://financeapp_test:financeapp_test_password@127.0.0.1:5432/financeapp_test
      DOCUMENT_DIR: /tmp/financeapp-documents
      DOCUMENT_KEY_B64: eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg=
      MASTER_TOKEN: financeapp-ci-master-token
      OLLAMA_URL: http://127.0.0.1:9
      REDIS_URL: redis://127.0.0.1:9/0
      RUN_POSTGRES_TESTS: "1"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install pip-audit
      - run: pip-audit
      - run: ruff check app tests alembic
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic upgrade head --sql > /tmp/financeapp-migrations.sql

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run build
      - run: npm run test:sites
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
