name: finanzas-personales

services:
  postgres:
    profiles: [core, ai]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_database}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_database}"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks: [private]

  redis:
    profiles: [core, ai]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    networks: [private]

  api:
    profiles: [core, ai]
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app_database}
      REDIS_URL: redis://redis:6379/0
      MASTER_TOKEN: ${MASTER_TOKEN}
      DOCUMENT_KEY_B64: ${DOCUMENT_KEY_B64}
      DOCUMENT_DIR: /data/documents
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-q4_K_M}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN}
    volumes:
      - encrypted-documents:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [private]

  worker:
    profiles: [core]
    build: ./server
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app_database}
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_KEY_B64: ${DOCUMENT_KEY_B64}
      DOCUMENT_DIR: /data/documents
    volumes:
      - encrypted-documents:/data/documents
    depends_on: [api, redis]
    networks: [private]

  ai-worker:
    profiles: [ai]
    build:
      context: ./server
      args:
        INSTALL_AI: "true"
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app_database}
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_KEY_B64: ${DOCUMENT_KEY_B64}
      DOCUMENT_DIR: /data/documents
    volumes:
      - encrypted-documents:/data/documents
    depends_on: [api, redis]
    networks: [private]

  web:
    profiles: [core, ai]
    build:
      context: ./web
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on: [api]
    networks: [private]

  ollama:
    image: ollama/ollama:latest
    profiles: [ai]
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks: [private]

networks:
  private:
    internal: true

volumes:
  postgres-data:
  redis-data:
  encrypted-documents:
  ollama-data:
